name: P9 - Imagenes en GHCR

# P9 (recuperacion ante desastres): tras destruir el cluster, el bootstrap
# debe poder descargar las imagenes de un registro EXTERNO. Antes vivian
# solo en el Docker local (kind load) y se perdian con la maquina.
# Publica unicamente los servicios que P9 despliega (api-gateway y ms-auth).
on:
  push:
    branches: [main]
    paths:
      - "P5/services/api-gateway/**"
      - "P5/services/ms-auth/**"
      - ".github/workflows/p9-imagenes.yml"
  workflow_dispatch:
    inputs:
      version:
        description: "Tag inmutable adicional (ej. v1.0.0). Nunca 'latest': Kyverno lo rechaza."
        required: false
        default: ""

jobs:
  test:
    name: "Test (${{ matrix.servicio }})"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [api-gateway, ms-auth]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: P5/services/${{ matrix.servicio }}/package-lock.json
      - working-directory: P5/services/${{ matrix.servicio }}
        run: npm install && npm test

  publicar:
    name: "Build y push (${{ matrix.servicio }})"
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        servicio: [api-gateway, ms-auth]
    steps:
      - uses: actions/checkout@v4

      # GHCR exige el nombre del dueno en minusculas (DanielVelAv -> danielvelav).
      - name: Nombre de la imagen
        id: nombre
        run: echo "imagen=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/sa-p9/${{ matrix.servicio }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Solo tags inmutables: el sha corto siempre, y la version si se pide a mano.
      - name: Tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.nombre.outputs.imagen }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=${{ inputs.version }},enable=${{ inputs.version != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: P5/services/${{ matrix.servicio }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=p9-${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=p9-${{ matrix.servicio }}

name: CI/CD - Plataforma de microservicios (P7)

# Se dispara en cada push a main y en cada Pull Request hacia main.
# El objetivo SMART de la practica exige "al menos 4 etapas: build,
# test, dockerizacion y despliegue" -- este workflow las implementa
# como 4 jobs secuenciales, cada uno dependiente del anterior via
# "needs", para que un fallo temprano detenga el pipeline sin gastar
# minutos de CI en etapas posteriores que igual fallarian.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Permite disparar el pipeline a mano desde la pestana Actions,
  # util para volver a generar evidencia sin necesitar un commit nuevo.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGEN_BASE: ghcr.io/${{ github.repository_owner }}/sa-p7

jobs:
  # =====================================================================
  # ETAPA 1 — BUILD + TEST
  # Instala dependencias y corre las pruebas unitarias reales de cada
  # microservicio. Node y Python se prueban en jobs separados porque
  # cada ecosistema necesita un runtime y un cache distinto.
  # =====================================================================
  test-node:
    name: "Build + Test (Node.js)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [ms-auth, ms-lotes, api-gateway]
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: P5/services/${{ matrix.servicio }}/package-lock.json

      - name: Instalar dependencias (build)
        working-directory: P5/services/${{ matrix.servicio }}
        run: npm install

      - name: Ejecutar pruebas unitarias (test)
        working-directory: P5/services/${{ matrix.servicio }}
        run: npm test

  test-python:
    name: "Build + Test (Python)"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [ms-aprobaciones]
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: P5/services/${{ matrix.servicio }}/requirements-dev.txt

      - name: Instalar dependencias (build)
        working-directory: P5/services/${{ matrix.servicio }}
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas unitarias (test)
        working-directory: P5/services/${{ matrix.servicio }}
        run: python -m pytest tests/ -v

  # =====================================================================
  # ETAPA 2 — DOCKERIZACION
  # Construye cada imagen y la publica en GitHub Container Registry.
  # Usa el GITHUB_TOKEN integrado: no requiere ningun secret adicional.
  # Solo corre si las dos etapas de test anteriores pasaron.
  # =====================================================================
  build-and-push:
    name: "Build y push de imagenes Docker"
    runs-on: ubuntu-latest
    needs: [test-node, test-python]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - servicio: api-gateway
            contexto: P5/services/api-gateway
          - servicio: ms-auth
            contexto: P5/services/ms-auth
          - servicio: ms-lotes
            contexto: P5/services/ms-lotes
          - servicio: ms-aprobaciones
            contexto: P5/services/ms-aprobaciones
          - servicio: ms-notificaciones
            contexto: P5/services/ms-notificaciones
          - servicio: cronjob-registro
            contexto: P5/scripts/cronjob-1
          - servicio: cronjob-resumen
            contexto: P5/scripts/cronjob-2
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configurar Buildx
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Calcular metadatos de la imagen (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGEN_BASE }}/${{ matrix.servicio }}
          tags: |
            type=sha,prefix=,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build y push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}

  # =====================================================================
  # ETAPA 3 — DEPLOY
  # Crea un cluster de Kubernetes efimero con "kind" DENTRO del propio
  # runner, carga las imagenes recien construidas directamente en el
  # cluster (sin pasar por ningun registro externo) y despliega con
  # Helm. El cluster se destruye solo al terminar el job -- sin nube,
  # sin credenciales de proveedor, sin costo.
  # =====================================================================
  deploy-kind:
    name: "Deploy en cluster kind (Kubernetes efimero)"
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Crear el cluster kind
        uses: helm/kind-action@v1
        with:
          cluster_name: sa-p7-ci
          wait: 90s

      - name: Instalar Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.16.2"

      - name: Construir las imagenes localmente (para cargarlas a kind)
        run: |
          docker build -t sa-p7/api-gateway:ci        P5/services/api-gateway
          docker build -t sa-p7/ms-auth:ci            P5/services/ms-auth
          docker build -t sa-p7/ms-lotes:ci           P5/services/ms-lotes
          docker build -t sa-p7/ms-aprobaciones:ci    P5/services/ms-aprobaciones
          docker build -t sa-p7/ms-notificaciones:ci  P5/services/ms-notificaciones
          docker build -t sa-p7/cronjob-registro:ci   P5/scripts/cronjob-1
          docker build -t sa-p7/cronjob-resumen:ci    P5/scripts/cronjob-2

      - name: Cargar las imagenes en el cluster kind
        run: |
          kind load docker-image sa-p7/api-gateway:ci        --name sa-p7-ci
          kind load docker-image sa-p7/ms-auth:ci            --name sa-p7-ci
          kind load docker-image sa-p7/ms-lotes:ci           --name sa-p7-ci
          kind load docker-image sa-p7/ms-aprobaciones:ci    --name sa-p7-ci
          kind load docker-image sa-p7/ms-notificaciones:ci  --name sa-p7-ci
          kind load docker-image sa-p7/cronjob-registro:ci   --name sa-p7-ci
          kind load docker-image sa-p7/cronjob-resumen:ci    --name sa-p7-ci

      - name: Generar llaves JWT efimeras para esta ejecucion
        run: |
          mkdir -p keys
          openssl genrsa -out keys/jwt_private.pem 2048
          openssl rsa -in keys/jwt_private.pem -pubout -out keys/jwt_public.pem

      - name: Generar secretos efimeros para esta ejecucion
        run: |
          AES_KEY_B64="$(openssl rand -base64 32 | tr -d '\n')"
          BLIND_INDEX_KEY_B64="$(openssl rand -base64 32 | tr -d '\n')"
          cat > secretos-ci.yaml << 'EOF'
          secrets:
            postgresPassword: "ci-postgres-pass"
            rabbitmqPassword: "ci-rabbitmq-pass"
            aesKey: "__AES_KEY_B64__"
            blindIndexKey: "__BLIND_INDEX_KEY_B64__"
            jwtAlgorithm: "RS256"
          postgresql:
            auth:
              postgresPassword: "ci-postgres-pass"
          rabbitmq:
            auth:
              password: "ci-rabbitmq-pass"
          EOF
          sed -i "s|__AES_KEY_B64__|${AES_KEY_B64}|g" secretos-ci.yaml
          sed -i "s|__BLIND_INDEX_KEY_B64__|${BLIND_INDEX_KEY_B64}|g" secretos-ci.yaml

      - name: Descargar las dependencias del chart (postgresql, rabbitmq)
        run: helm dependency build ./P5/charts/sa-platform

      - name: Desplegar con Helm
        run: |
          helm upgrade --install sa-platform ./P5/charts/sa-platform \
            --namespace sa-p7 \
            -f P5/charts/sa-platform/values.yaml \
            -f P5/charts/sa-platform/values-kind.yaml \
            -f secretos-ci.yaml \
            --set-file secrets.jwtPrivateKey=keys/jwt_private.pem \
            --set-file secrets.jwtPublicKey=keys/jwt_public.pem \
            --timeout 5m \
            --wait

      - name: Verificar que todos los pods esten en Running
        run: |
          kubectl get pods -n sa-p7
          kubectl wait --for=condition=Ready pods --all -n sa-p7 --timeout=180s

      - name: Verificar el health del api-gateway (evidencia de funcionamiento)
        run: |
          kubectl port-forward -n sa-p7 svc/sa-platform-api-gateway 8080:8080 &
          sleep 5
          curl -f http://localhost:8080/health || (echo "El health check fallo" && exit 1)

      - name: Mostrar el estado final del cluster (evidencia para la documentacion)
        if: always()
        run: |
          echo "### Pods ###"
          kubectl get pods -n sa-p7 -o wide
          echo "### Services ###"
          kubectl get svc -n sa-p7
          echo "### Eventos (para depurar si algo fallo) ###"
          kubectl get events -n sa-p7 --sort-by='.lastTimestamp'
